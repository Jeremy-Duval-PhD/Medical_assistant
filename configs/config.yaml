models:
  embedding:
    sentence-transformers/all-MiniLM-L6-v2

retrieval:
  top_k: 3
  search_multiplier: 3
  search_min: 10
  min_unique_articles: 3
  final_articles: 3

chunking:
  chunk_size: 500
  overlap_sentences: 1

llm:
  provider: ollama
  model: qwen2.5:1.5b

generation:
  temperature: 0.1
  max_tokens: 150