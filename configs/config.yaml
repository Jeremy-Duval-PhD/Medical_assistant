models:
  embedding:
    sentence-transformers/all-MiniLM-L6-v2

retrieval:
  top_k: 3
  search_multiplier: 20
  search_min: 100
  min_unique_articles: 3
  final_articles: 3

  semantic_weight: 0.70
  keyword_weight: 0.15
  mesh_weight: 0.15

  reranking:
    enabled: true
    evidence_weight: 0.05
    recency_weight: 0.01

chunking:
  chunk_size: 500
  overlap_sentences: 1

llm:
  provider: ollama
  model: qwen2.5:1.5b

generation:
  temperature: 0.1
  max_tokens: 150